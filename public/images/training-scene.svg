<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="gymSceneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171A"/>
      <stop offset="60%" stop-color="#1F242B"/>
      <stop offset="100%" stop-color="#0E1012"/>
    </linearGradient>
    <linearGradient id="sunbeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#gymSceneBg)"/>

  <!-- High modern gym glass windows -->
  <line x1="100" y1="0" x2="100" y2="600" stroke="#252A30" stroke-width="4"/>
  <line x1="400" y1="0" x2="400" y2="600" stroke="#252A30" stroke-width="4"/>
  <line x1="700" y1="0" x2="700" y2="600" stroke="#252A30" stroke-width="4"/>
  <line x1="1000" y1="0" x2="1000" y2="600" stroke="#252A30" stroke-width="4"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#252A30" stroke-width="4"/>

  <!-- Sunbeam light wash -->
  <polygon points="1200,0 800,0 300,800 1200,800" fill="url(#sunbeam)"/>

  <!-- Gym Floor -->
  <rect x="0" y="600" width="1200" height="200" fill="#0C0E10"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#252A30" stroke-width="2"/>

  <!-- Kettlebells row -->
  <g transform="translate(150, 520)">
    <!-- KB 16kg -->
    <path d="M 20 60 C 20 20 60 20 60 60" stroke="#374151" stroke-width="8" fill="none"/>
    <circle cx="40" cy="80" r="32" fill="#1F2937"/>
    <rect x="28" y="74" width="24" height="12" rx="2" fill="#CCFF00"/>
    <!-- KB 24kg -->
    <path d="M 120 50 C 120 10 170 10 170 50" stroke="#4B5563" stroke-width="10" fill="none"/>
    <circle cx="145" cy="75" r="38" fill="#111827"/>
    <rect x="133" y="68" width="24" height="12" rx="2" fill="#CCFF00"/>
    <!-- KB 32kg -->
    <path d="M 230 40 C 230 -5 290 -5 290 40" stroke="#4B5563" stroke-width="12" fill="none"/>
    <circle cx="260" cy="70" r="44" fill="#0B0F14"/>
    <rect x="248" y="62" width="24" height="12" rx="2" fill="#CCFF00"/>
  </g>

  <!-- Female client squatting + Trainer supervising -->
  <g transform="translate(620, 240)">
    <!-- Trainer standing (black shirt, watchful posture) -->
    <g transform="translate(240, 60)">
      <circle cx="35" cy="25" r="22" fill="#1A1D22"/>
      <path d="M 10 50 L 60 50 L 52 180 L 18 180 Z" fill="#13161A"/>
      <path d="M 10 55 L -10 110 L -25 150" stroke="#16191E" stroke-width="16" stroke-linecap="round" fill="none"/>
      <path d="M 60 55 L 75 110 L 60 160" stroke="#16191E" stroke-width="14" stroke-linecap="round" fill="none"/>
      <path d="M 18 180 L 15 320 L 32 320 L 35 190 L 37 190 L 40 320 L 57 320 L 52 180 Z" fill="#0D0F12"/>
    </g>

    <!-- Client performing deep squat with kettlebell -->
    <g transform="translate(60, 160)">
      <circle cx="50" cy="25" r="18" fill="#3D312E"/>
      <!-- Torso angled in perfect squat form -->
      <path d="M 30 45 L 70 45 L 85 140 L 15 140 Z" fill="#1C1F24"/>
      <!-- Arms holding kettlebell in front of chest (Goblet Squat) -->
      <path d="M 30 50 L 10 90 L 35 105" stroke="#1F242A" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M 70 50 L 90 90 L 65 105" stroke="#1F242A" stroke-width="12" stroke-linecap="round" fill="none"/>
      <!-- Kettlebell in hands -->
      <circle cx="50" cy="115" r="18" fill="#111827"/>
      <!-- Thighs parallel to ground (biomechanically sound squat) -->
      <path d="M 15 140 L -25 170 L -10 230" stroke="#14171A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 85 140 L 125 170 L 110 230" stroke="#14171A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
  
  <!-- Subtle overlay -->
  <rect width="1200" height="800" fill="black" opacity="0.25"/>
</svg>
